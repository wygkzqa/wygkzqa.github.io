<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Paste Lite — macOS 原生剪贴板管理工具</title>
    <meta name="description" content="Paste Lite 是免费开源的 macOS 原生剪贴板管理工具。访问中文或英文官网，了解功能并下载应用。">
    <link rel="canonical" href="https://wygkzqa.github.io/">
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Paste Lite">
    <meta property="og:title" content="Paste Lite — A native clipboard manager for Mac">
    <meta property="og:url" content="https://wygkzqa.github.io/">
    <meta property="og:image" content="https://wygkzqa.github.io/favicon.png">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Paste Lite",
        "url": "https://wygkzqa.github.io/"
    }
    </script>
    <style>
        :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fbfbfd; color: #20212a; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 48px 24px; }
        main { width: 100%; max-width: 640px; }
        .logo { display: block; width: 80px; height: 80px; margin-bottom: 32px; }
        .eyebrow { color: #656977; font-size: 13px; letter-spacing: .08em; margin: 0 0 14px; }
        h1 { font-size: clamp(44px, 10vw, 64px); line-height: 1.1; letter-spacing: -.045em; margin: 0 0 24px; }
        .intro { font-size: 22px; line-height: 1.6; margin: 0 0 12px; }
        .english { color: #656977; font-size: 17px; line-height: 1.7; margin: 0; max-width: 540px; }
        .links { display: flex; flex-wrap: wrap; gap: 12px; margin: 32px 0 24px; }
        a { color: #215dbe; text-underline-offset: 4px; }
        .button { display: inline-block; padding: 13px 22px; border: 1px solid #215dbe; border-radius: 12px; text-decoration: none; font-size: 16px; font-weight: 600; }
        .primary { color: #fff; background: #215dbe; }
        a:hover { text-decoration: underline; }
        a:focus-visible { outline: 3px solid #215dbe; outline-offset: 5px; }
        .details { color: #656977; font-size: 13px; line-height: 1.8; margin: 0; }
        footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid #dedfe5; font-size: 14px; }
        @media (prefers-color-scheme: dark) {
            :root { background: #13151d; color: #f1f2f6; }
            .eyebrow, .english, .details { color: #a9afbd; }
            a { color: #9dc2ff; }
            .button { border-color: #9dc2ff; }
            .primary { background: #9dc2ff; color: #13151d; }
            a:focus-visible { outline-color: #9dc2ff; }
            footer { border-color: #353946; }
        }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="/favicon.png" width="80" height="80" alt="">
        <p class="eyebrow" lang="en">A LITTLE MORE MEMORY FOR YOUR CLIPBOARD</p>
        <h1>Paste Lite</h1>
        <p class="intro">复制过的，都在手边。</p>
        <p class="english" lang="en">A free, open-source clipboard manager, made for macOS. Keep text, links, images and file references close at hand.</p>
        <nav class="links" aria-label="选择官网语言">
            <a class="button primary" href="/paste-lite/" hreflang="zh-CN">访问中文官网</a>
            <a class="button" href="/paste-lite/en/" hreflang="en" lang="en">Visit in English</a>
        </nav>
        <p class="details">macOS 14+ · Apple Silicon / Intel · 免费开源</p>
        <footer><a href="https://github.com/wygkzqa/paste-lite" lang="en">View source on GitHub ↗</a></footer>
    </main>
</body>
</html>
